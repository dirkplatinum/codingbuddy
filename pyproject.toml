[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unitconv"
version = "0.1.0"
description = "Convert between common units."
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
unitconv = "unitconv.cli:main"

[tool.setuptools]
packages = ["unitconv"]
